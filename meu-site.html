<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Site | Mama Design</title><style>:root{--g:#28533f;--t:#bd5134;--b:#f5eee5}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--g);font:15px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px 18px}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:40px}section{background:#fffaf4;border:1px solid #e2d4c4;padding:24px;border-radius:15px;margin:18px 0}label{display:block;font-weight:600;margin:14px 0}input,textarea,select{width:100%;padding:11px;border:1px solid #d8c6b7;border-radius:8px;background:white;font:inherit;margin-top:7px}input[type=checkbox]{width:auto}textarea{min-height:90px}button,a.btn{border:0;border-radius:8px;background:var(--g);color:white;padding:11px 16px;cursor:pointer;font:600 14px system-ui;text-decoration:none;display:inline-block}button.terra{background:var(--t)}button.soft{background:#eaded1;color:var(--g)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#776e65}.status{padding:14px;border-radius:8px;background:#e4ecdf;margin:18px 0;white-space:pre-wrap}.project{border:1px solid #ddcdbb;border-radius:12px;padding:16px;margin:15px 0}.photos{display:flex;gap:12px;flex-wrap:wrap}.photo{width:150px;padding:8px;background:#f0e9e1;border-radius:8px}.photo img{width:100%;height:115px;object-fit:cover}.photo button{font-size:11px;padding:7px;margin:3px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:32px}}</style></head><body><main><a class="btn" href="/">← Manager</a><h1>Meu Site</h1><p class="muted">Edite online e publique quando estiver pronta. Fotos ficam na nuvem.</p><div class="status" id="status">Verificando acesso…</div><div id="editor" class="hidden"><div class="row"><button id="save">Salvar rascunho</button><button class="terra" id="publish">Publicar conteúdo</button><label style="margin:0"><input type="file" accept="application/json" id="import"> Importar backup JSON</label></div><section><h2>Textos do site</h2><div class="grid"><label>Título principal<input id="heroTitle"></label><label>Subtítulo<textarea id="heroText"></textarea></label></div><label>Título sobre mim<input id="aboutTitle"></label><label>Sobre mim<textarea id="aboutText"></textarea></label><div class="grid"><label>Título do contato<input id="contactTitle"></label><label>Texto do contato<textarea id="contactText"></textarea></label></div><label>WhatsApp (com DDI)<input id="whatsapp"></label></section><section><h2>Portfólio</h2><p class="muted">A primeira foto de cada projeto será a capa. Você pode alterar a ordem.</p><div id="projects"></div><button id="addProject">+ Adicionar projeto</button></section><section><h2>Pacotes e adicionais</h2><p class="muted">Edição estruturada em JSON nesta primeira versão.</p><label>Infantil e Social<textarea id="kids" rows="10"></textarea></label><label>15 anos e Casamento<textarea id="shared" rows="10"></textarea></label><label>Adicionais<textarea id="addons" rows="8"></textarea></label></section><div class="row"><button id="save2">Salvar rascunho</button><button class="terra" id="publish2">Publicar conteúdo</button></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="document.getElementById('status').textContent='Falha ao carregar biblioteca Supabase. Verifique a conexão ou bloqueio de scripts.'"></script><script>
const URL='https://zhdvnziazdcbquzslsls.supabase.co',KEY='sb_publishable_FUYtdpkrTsLeEP9y38WGaQ_hab989mF',COMPANY='af4954d7-1ebf-480e-8ca2-4f1e2c61b6c9';const $=id=>document.getElementById(id);let api=null,content={};const fields={heroTitle:'.hero-copy h1',heroText:'.hero-copy p',aboutTitle:'.story h2',aboutText:'.story p',contactTitle:'.contact h2',contactText:'.contact p'};function msg(s){$('status').textContent=s}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function normalize(){content.projects??=[];content.settings??={};content.settings.visual??={};content.settings.visual.texts??={};for(const p of content.projects){p.images??=[];if(p.title?.includes('inspiração'))p.draft=true}}
async function init(){try{if(!window.supabase?.createClient)throw Error('Biblioteca de conexão não carregou. Verifique a internet ou bloqueadores de scripts.');api=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});msg('Conectando ao Supabase…');const withTimeout=(promise,ms=12000)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(Error('Tempo esgotado ao conectar. Confira se o Supabase está acessível e se o navegador não está bloqueando a conexão.')),ms))]);const {data:{user},error}=await withTimeout(api.auth.getUser());if(error||!user)throw Error('Entre no Manager primeiro com sua conta administradora.');const {data:membership,error:me}=await withTimeout(api.from('memberships').select('role')).eq('company_id',COMPANY).eq('user_id',user.id);if(me)throw me;if(!membership?.some(x=>['owner','admin'].includes(x.role)))throw Error('Sua conta não possui acesso de administradora.');const {data:row,error:e}=await withTimeout(api.from('site_content').select('draft,published')).eq('id','mama').single();if(e)throw e;content=Object.keys(row.draft||{}).length?row.draft:row.published||{};normalize();render();$('editor').classList.remove('hidden');msg('Conectado! Você pode editar e salvar seu rascunho.')}catch(e){msg('Não foi possível abrir o editor: '+e.message)}}
function render(){normalize();for(const [id,k] of Object.entries(fields))$(id).value=content.settings.visual.texts[k]||'';$('whatsapp').value=content.settings.whatsapp||'';for(const k of ['kids','shared','addons'])$(k).value=JSON.stringify(content[k]||[],null,2);renderProjects()}
function renderProjects(){$('projects').innerHTML=content.projects.map((p,i)=>`<div class="project" data-i="${i}"><div class="row"><b>Projeto ${i+1}</b><button class="soft" data-remove="${i}">Excluir projeto</button></div><div class="grid"><label>Nome<input data-field="title" value="${esc(p.title)}"></label><label>Categoria<select data-field="cat">${[['infantil','Infantil'],['social','Social'],['debutante','15 anos'],['casamento','Casamento']].map(([v,n])=>`<option value="${v}" ${p.cat===v?'selected':''}>${n}</option>`).join('')}</select></label></div><label>Descrição<textarea data-field="desc">${esc(p.desc)}</textarea></label><label><input type="checkbox" data-field="draft" ${p.draft?'checked':''}> Rascunho (não exibir publicamente)</label><label>Enviar fotos<input type="file" data-upload="${i}" accept="image/png,image/jpeg,image/webp" multiple></label><div class="photos">${p.images.map((im,j)=>`<div class="photo">${/^https:\/\//.test(im)?`<img src="${esc(im)}" alt="">`:`<small>Imagem antiga: ${esc(im)}</small>`}<div><button data-cover="${i}:${j}">${j===0?'Capa ✓':'Definir capa'}</button><button class="soft" data-delete-photo="${i}:${j}">Excluir</button></div></div>`).join('')}</div></div>`).join('')}
$('projects').addEventListener('input',e=>{const box=e.target.closest('.project');if(!box)return;const p=content.projects[+box.dataset.i],field=e.target.dataset.field;if(field)p[field]=field==='draft'?e.target.checked:e.target.value});$('projects').addEventListener('change',async e=>{const input=e.target;if(input.dataset.upload===undefined)return;const p=content.projects[+input.dataset.upload];for(const file of input.files){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10485760){msg('Imagem inválida ou acima de 10 MB: '+file.name);continue}const path='portfolio/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');msg('Enviando '+file.name+'…');const {error}=await api.storage.from('mama-site').upload(path,file,{contentType:file.type});if(error){msg('Erro ao enviar: '+error.message);return}p.images.push(api.storage.from('mama-site').getPublicUrl(path).data.publicUrl)}renderProjects();msg('Fotos enviadas à nuvem. Salve o rascunho para registrar as mudanças.')});$('projects').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let i,j;if(b.dataset.remove!==undefined)content.projects.splice(+b.dataset.remove,1);else if(b.dataset.cover){[i,j]=b.dataset.cover.split(':').map(Number);const a=content.projects[i].images;a.unshift(a.splice(j,1)[0])}else if(b.dataset.deletePhoto){[i,j]=b.dataset.deletePhoto.split(':').map(Number);content.projects[i].images.splice(j,1)}renderProjects()});$('addProject').onclick=()=>{content.projects.push({title:'Novo projeto',cat:'infantil',desc:'',images:[],draft:true});renderProjects()};
$('import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const v=JSON.parse(await f.text());if(!Array.isArray(v.projects))throw Error('Backup sem projetos');if(!confirm('Importar os dados do backup para o editor? Depois clique em Salvar rascunho.'))return;content=v;render();msg('Backup importado no editor. Clique em Salvar rascunho.')}catch(err){msg('Erro na importação: '+err.message)}};
function collect(){for(const [id,k] of Object.entries(fields))content.settings.visual.texts[k]=$(id).value;content.settings.whatsapp=$('whatsapp').value.replace(/\D/g,'');for(const k of ['kids','shared','addons']){const v=JSON.parse($(k).value);if(!Array.isArray(v))throw Error(k+' deve ser uma lista JSON');content[k]=v}}
async function save(publish){try{collect();msg('Salvando…');const {error}=await api.from('site_content').update({draft:content,updated_at:new Date().toISOString()}).eq('id','mama');if(error)throw error;if(publish){const visible=structuredClone(content);visible.projects=visible.projects.filter(p=>!p.draft);const {error:pe}=await api.from('site_published').upsert({id:'mama',published:visible,published_at:new Date().toISOString()});if(pe)throw pe}msg(publish?'Publicado no banco! A página pública ainda precisa ser integrada para mostrar o conteúdo.':'Rascunho salvo na nuvem.')}catch(e){msg('Falha ao salvar: '+e.message)}}$('save').onclick=$('save2').onclick=()=>save(false);$('publish').onclick=$('publish2').onclick=()=>save(true);init();
</script></body></html>
